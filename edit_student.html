<!DOCTYPE html>
<html>

<head>

    <title>Edit Student</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="form-container">

    <h1>Edit Student</h1>

    <form
        method="POST"
        onsubmit="return validateForm()">

        <label>Student Name</label>

        <input
            type="text"
            id="name"
            name="name"
            value="{{ student.name }}">


        <label>Email</label>

        <input
            type="email"
            id="email"
            name="email"
            value="{{ student.email }}">


        <label>Course</label>

        <input
            type="text"
            id="course"
            name="course"
            value="{{ student.course }}">


        <label>Phone Number</label>

        <input
            type="text"
            id="phone"
            name="phone"
            value="{{ student.phone }}">


        <button type="submit">
            Update Student
        </button>

    </form>

    <br>

    <a href="/">
        Back to Home
    </a>

</div>


<script src="{{ url_for('static', filename='script.js') }}">
</script>

</body>

</html>
