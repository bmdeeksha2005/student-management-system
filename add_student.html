<!DOCTYPE html>
<html>

<head>

    <title>Add Student</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="form-container">

    <h1>Add Student</h1>

    <form
        method="POST"
        onsubmit="return validateForm()">

        <label>Student Name</label>

        <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter student name">


        <label>Email</label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter email">


        <label>Course</label>

        <input
            type="text"
            id="course"
            name="course"
            placeholder="Enter course">


        <label>Phone Number</label>

        <input
            type="text"
            id="phone"
            name="phone"
            placeholder="Enter phone number">


        <button type="submit">
            Add Student
        </button>

    </form>

    <br>

    <a href="/">
        Back to Home
    </a>

</div>


<script src="{{ url_for('static', filename='script.js') }}">
</script>

</body>

</html>
